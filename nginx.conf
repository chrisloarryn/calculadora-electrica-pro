map $uri $cache_control {
  default "no-cache";
  /health "no-store";
  /index.html "no-cache, no-store, must-revalidate";
  /manifest.webmanifest "no-cache, no-store, must-revalidate";
  /sw.js "no-cache, no-store, must-revalidate";
  /service-worker.js "no-cache, no-store, must-revalidate";
  /registerSW.js "no-cache, no-store, must-revalidate";
  ~^/workbox-[^/]+\.js$ "no-cache, no-store, must-revalidate";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/(?:icons|screenshots)/ "public, max-age=86400";
}

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  add_header Cache-Control $cache_control always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /assets/ {
    try_files $uri =404;
  }

  location ~* \.map$ {
    return 404;
  }

  location = /manifest.webmanifest {
    try_files $uri =404;
  }

  location ~ ^/(?:sw|service-worker)\.js$ {
    try_files $uri =404;
  }

  location ~ ^/(?:registerSW|workbox-[^/]+)\.js$ {
    try_files $uri =404;
  }

  location ~* \.(?:avif|css|gif|ico|jpe?g|js|json|map|mjs|pdf|png|svg|ttf|webmanifest|webp|woff2?)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
